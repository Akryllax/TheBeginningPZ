syntax = "proto3";
package lofers.npc.v1;
option java_package = "net.lofers.scenario.protocol";
option java_outer_classname = "NpcControl";

// Gameplay transport, separate from Observer's read-only protocol. All plans
// are proposals; only the game may commit effects or durable resident state.
message Point { double x = 1; double y = 2; int32 z = 3; }
message Place { string id = 1; string kind = 2; Point position = 3; bool available = 4; uint64 revision = 5; }
message RoadNode { uint32 id = 1; Point position = 2; }
message RoadEdge { uint32 from = 1; uint32 to = 2; double cost = 3; bool blocked = 4; }
message RoadClosure {
  uint32 from = 1; uint32 to = 2; double expires_world_hour = 3;
  string reason = 4;
}
message VehicleObservation {
  string id = 1; Point position = 2; double heading_degrees = 3;
  double speed_kmh = 4; string profile = 5; bool available = 6;
  uint64 occupancy_revision = 7;
  Point entry_point = 8;
}
message Resident {
  string id = 1; uint64 revision = 2; uint64 generation = 3;
  string name = 4; string role = 5; Point position = 6;
  Point home = 7; Point work = 8; Point shop = 9; Point clinic = 10;
  double hunger = 11; double fatigue = 12; double fear = 13;
  string infection = 14; double health = 15; bool materialized = 16;
  bool has_vehicle = 17; string vehicle_id = 18; bool threatened = 19;
  bool home_safe = 20; bool work_available = 21; bool has_food = 22;
  string current_action = 23; uint64 plan_revision = 24;
  uint64 lease_epoch = 25; double exposed_hour = 26;
  bool in_vehicle = 27; // Actual current seat occupancy; ownership is has_vehicle.
  VehicleObservation vehicle_observation = 28;
}
enum ActionKind {
  ACTION_UNSPECIFIED = 0; WAIT = 1; WALK = 2; EAT = 3; REST = 4;
  WORK = 5; SHOP = 6; SOCIALIZE = 7; SEEK_HELP = 8; FLEE = 9;
  DRIVE = 10; PARK = 11; ENTER_VEHICLE = 12; EXIT_VEHICLE = 13;
  TREAT = 14; PATROL = 15; SCAVENGE = 16; SHELTER = 17;
}
message Action {
  string id = 1; ActionKind kind = 2; Point target = 3;
  string target_id = 4; double duration_hours = 5;
  repeated Point route = 6; string animation = 7;
  string navigation_id = 8;
  repeated uint32 road_node_ids = 9;
}
message Plan {
  string resident_id = 1; uint64 based_on_revision = 2;
  uint64 generation = 3; uint64 plan_revision = 4; string goal = 5;
  repeated Action actions = 6; string reason = 7;
  uint32 expansions = 8; double compute_ms = 9;
}
message ObservationBatch {
  uint64 revision = 1; double world_hour = 2; double scenario_hour = 3;
  string phase = 4; bool paused = 5; uint64 seed = 6;
  repeated Resident residents = 7; repeated Place places = 8;
  repeated RoadNode road_nodes = 9; repeated RoadEdge road_edges = 10;
  uint32 online_players = 11;
  string navigation_id = 12;
  repeated RoadClosure road_closures = 13;
}
message PlanBatch {
  uint64 observation_revision = 1; repeated Plan plans = 2;
  uint32 deferred = 3; double compute_ms = 4; string rules_hash = 5;
}
message Handshake {
  string build = 1; string mod_version = 2; string registry_hash = 3;
  uint32 max_frame_bytes = 4; uint32 max_residents = 5;
}
message Receipt {
  string resident_id = 1; string action_id = 2; uint64 generation = 3;
  uint64 plan_revision = 4; uint64 lease_epoch = 5;
  string state = 6; string reason = 7;
}
message Status { string health = 1; string detail = 2; uint32 queue = 3; uint32 workers = 4; }
message Envelope {
  uint32 protocol_version = 1; string world = 2; string server_epoch = 3;
  uint64 request_id = 4;
  oneof body {
    Handshake hello = 10; ObservationBatch observations = 11;
    PlanBatch plans = 12; Receipt receipt = 13; Status status = 14;
  }
}
