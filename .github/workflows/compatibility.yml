name: Compatibility auditor fixtures
on:
  push:
  pull_request:
jobs:
  synthetic-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - run: |
          python -m venv .tooling/venv
          .tooling/venv/bin/python -m pip install --require-hashes -r requirements-dev.lock
          .tooling/venv/bin/python -m pytest tests/test_compat.py -q
      - name: Missing proprietary inputs must report BLOCKED
        run: |
          set +e
          ./dayone compat snapshot --profile pz42.21
          result=$?
          test "$result" -eq 2
      - uses: actions/upload-artifact@v4
        with:
          name: compatibility-input-report
          path: artifacts/compat/runs/
