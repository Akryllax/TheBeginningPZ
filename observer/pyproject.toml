[project]
name = "zomboid-observer"
version = "0.1.0"
description = "An independent, observation-only Project Zomboid world viewer"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pillow>=12.3.0",
  "protobuf>=7.36.1,<8",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
extend-exclude = ["observer/proto/positions_pb2.py"]
